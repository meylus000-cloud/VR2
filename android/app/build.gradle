plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vrcable'
    compileSdk 34

    defaultConfig {
        applicationId "com.vrcable"
        minSdk 31
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
