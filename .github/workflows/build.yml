name: Build VR Cable

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VRCable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: VRCable.apk

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Publish Windows app
        run: dotnet publish windows/VRCable/VRCable.csproj -c Release -o out
      - name: Download adb and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/tools | Out-Null
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip pt
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll out/tools/
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $ffmpeg = Get-ChildItem -Recurse -Path ff -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName out/tools/ffmpeg.exe
          Copy-Item apk/VRCable.apk out/VRCable.apk
          Get-ChildItem out -Recurse | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: VRCable-Windows
          path: out
